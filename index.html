<template id="help-doc"><div class="document"><h1>Desktop Help</h1><p>Click or tap an icon to open it. Drag a title bar to move a window, or double-click it to maximize or restore it.</p><p>Use the taskbar to switch between windows. In Selected Project, switch between Icons and List to browse the same files.</p><p>Right-click the wallpaper or use Start to open Display Properties.</p></div></template>

<template id="nearby-doc"><div class="document"><p><small>PROJECT 01 / CAMPUS DISCOVERY</small></p><h3>What’s Near Me</h3><p>A location-based web app for UBC students to find nearby restaurants, study spots, and campus resources.</p><p><small>Next.js · OpenStreetMap · Tailwind CSS</small></p><p><a class="raised launch" href="https://whats-near-me.vercel.app/">Launch ↗</a> <a href="https://github.com/hhdning21/whats-near-me">View source on GitHub ↗</a></p></div></template>
<template id="asl-doc"><div class="document"><p><small>PROJECT 02 / COMPUTER VISION</small></p><h3>ASL Translator</h3><p>A webcam-based experiment that recognizes American Sign Language gestures using MediaPipe hand landmarks and a random forest classifier.</p><p><small>Python · MediaPipe · scikit-learn</small></p><p><a href="https://github.com/hhdning21/ASL-translator">View source on GitHub ↗</a></p></div></template>
<template id="furry-doc"><div class="document"><p><small>PROJECT 03 / AUDIO &amp; INTERACTION</small></p><h3>Furry Sound</h3><p>A music visualizer and four-lane rhythm game with visual beat cues, a high-contrast mode, and keyboard or touch controls.</p><p><small>JavaScript · Web Audio API</small></p><p><a class="raised launch" href="https://www.furrysound.tech/">Play ↗</a> <a href="https://github.com/hhdning21/furry-sound">View source on GitHub ↗</a></p></div></template>
<template id="pet-adopter-doc"><div class="document"><p><small>PROJECT 04 / DESKTOP APP</small></p><h3>Pet Adaptation App</h3><p>A Java desktop app for browsing pets available for adoption, submitting applications, and reporting stray animals. Adopters can record their pets’ stories, and the app saves data locally as JSON.</p><p><small>Java · JSON</small></p><p><a href="https://github.com/hhdning21/pet_adoption_app">View source on GitHub ↗</a></p></div></template>
