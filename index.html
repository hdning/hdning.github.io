<nav class="shortcuts" aria-label="Desktop shortcuts">
<button class="shortcut" data-open="computer"><svg class="icon" aria-hidden="true"><use href="#computer"/></svg><span>My Computer</span></button>
<button class="shortcut" data-open="work"><svg class="icon" aria-hidden="true"><use href="#folder"/></svg><span>Selected Project</span></button>
<button class="shortcut" data-open="about"><svg class="icon" aria-hidden="true"><use href="#note"/></svg><span>About.txt</span></button>
<button class="shortcut" data-open="contact"><svg class="icon" aria-hidden="true"><use href="#mail"/></svg><span>Contact</span></button>
</nav>
<div class="popup bevel" id="popup" hidden></div>
</main>
<footer class="taskbar" aria-label="Taskbar">
<button class="start raised" id="start" aria-controls="start-menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#flag"/></svg>Start</button>
<div class="tasks" id="tasks" aria-label="Open windows"></div>
<button class="raised" id="show-desktop" aria-label="Show desktop" title="Show desktop" style="height:29px;padding:0 6px">▣</button>
<time class="clock sunken" id="clock"></time>
<div class="start-menu bevel" id="start-menu" hidden>
<div class="start-rail" aria-hidden="true">Danning Hao 98</div>
<div>
<button data-open="work"><svg class="icon" aria-hidden="true"><use href="#folder"/></svg>Selected Project</button>
<button data-open="about"><svg class="icon" aria-hidden="true"><use href="#note"/></svg>About.txt</button>
<button data-open="contact"><svg class="icon" aria-hidden="true"><use href="#mail"/></svg>Contact</button>
<hr>
<button data-open="settings"><svg class="icon" aria-hidden="true"><use href="#computer"/></svg>Display Properties</button>
<button data-toggle-theme aria-pressed="false">Dark mode</button>
<button data-reset><svg class="icon" aria-hidden="true"><use href="#flag"/></svg>Reset desktop</button>
</div></div>
</footer>
<template id="frame">
<section class="window bevel" role="region" tabindex="-1">
<div class="titlebar"><svg class="icon" aria-hidden="true"><use/></svg><h2></h2><div class="controls"><button class="raised" data-window="min" aria-label="Minimize" title="Minimize">_</button><button class="raised" data-window="max" aria-label="Maximize" title="Maximize">□</button><button class="raised" data-window="close" aria-label="Close" title="Close">×</button></div></div>
<div class="win-body"></div>
</section>
</template>
<template id="explorer">
<div class="menubar" aria-label="Explorer commands"><button data-menu="file" aria-expanded="false"><u>F</u>ile</button><button data-menu="view" aria-expanded="false"><u>V</u>iew</button><button data-open="help"><u>H</u>elp</button></div>
<div class="toolbar"><button class="raised" data-open="computer">← Up</button><span class="spacer"></span><button class="raised" data-view="icons" aria-pressed="true">▦ Icons</button><button class="raised" data-view="list" aria-pressed="false">☰ List</button></div>
<div class="address"><span>Address</span><div class="path sunken"></div></div>
<div class="workarea">
<aside class="sidebar"><svg class="icon" aria-hidden="true"><use/></svg><h1></h1><div class="colorbar"></div><p></p></aside>
<div class="files"><span class="label"></span><div class="file-grid"></div></div>
</div>
<div class="statusbar"><span class="sunken"></span><span class="sunken">Local portfolio</span></div>
</template>
<template id="about-doc"><div class="document"><h1>Danning Hao</h1><p>An index of digital projects, visual systems, and small experiments.</p><p>Explore my projects in Selected Project or find more on <a href="https://github.com/hhdning21">GitHub</a>.</p></div></template>
<template id="contact-doc"><div class="document"><h1>Say hello.</h1><p><a href="mailto:hhdning21@gmail.com">hhdning21@gmail.com</a></p></div></template>
<template id="help-doc"><div class="document"><h1>Desktop Help</h1><p>Click or tap an icon to open it. Drag a title bar to move a window, or double-click it to maximize or restore it.</p><p>Use the taskbar to switch between windows. In Selected Project, switch between Icons and List to browse the same files.</p><p>Right-click the wallpaper or use Start to open Display Properties.</p></div></template>
<template id="settings-doc"><div class="document"><h1>Display Properties</h1><p>Color mode</p><div class="settings"><button class="raised" data-theme="light" aria-pressed="true">Light</button><button class="raised" data-theme="dark" aria-pressed="false">Dark</button></div></div></template>
<template id="nearby-doc"><div class="document"><p><small>PROJECT 01 / CAMPUS DISCOVERY</small></p><h3>What’s Near Me</h3><p>A location-based web app for UBC students to find nearby restaurants, study spots, and campus resources.</p><p><small>Next.js · OpenStreetMap · Tailwind CSS</small></p><p><a href="https://whats-near-me.vercel.app/">Try What’s Near Me ↗</a> · <a href="https://github.com/hhdning21/whats-near-me">View source on GitHub ↗</a></p></div></template>
<template id="asl-doc"><div class="document"><p><small>PROJECT 02 / COMPUTER VISION</small></p><h3>ASL Translator</h3><p>A webcam-based experiment that recognizes American Sign Language gestures using MediaPipe hand landmarks and a random forest classifier.</p><p><small>Python · MediaPipe · scikit-learn</small></p><p><a href="https://github.com/hhdning21/ASL-translator">View source on GitHub ↗</a></p></div></template>
<template id="furry-doc"><div class="document"><p><small>PROJECT 03 / AUDIO &amp; INTERACTION</small></p><h3>Furry Sound</h3><p>A music visualizer and four-lane rhythm game with visual beat cues, a high-contrast mode, and keyboard or touch controls.</p><p><small>JavaScript · Web Audio API</small></p><p><a href="https://www.furrysound.tech/">Play Furry Sound ↗</a> · <a href="https://github.com/hhdning21/furry-sound">View source on GitHub ↗</a></p></div></template>
<template id="pet-adopter-doc"><div class="document"><p><small>PROJECT 04 / DESKTOP APP</small></p><h3>Pet Adaptation App</h3><p>A Java desktop app for browsing pets available for adoption, submitting applications, and reporting stray animals. Adopters can record their pets’ stories, and the app saves data locally as JSON.</p><p><small>Java · JSON</small></p><p><a href="https://github.com/hhdning21/pet_adoption_app">View source on GitHub ↗</a></p></div></template>
</body>
</html>
